name: flutter_volume_listener
description: "A Flutter plugin to reliably read volume and listen to volume changes on iOS and Android."
version: 0.9.2
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  pigeon: ^29.1.1
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.adampalinkas.flutter_volume_listener
        pluginClass: FlutterVolumeListenerPlugin
      ios:
        pluginClass: FlutterVolumeListenerPlugin
